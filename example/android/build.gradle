buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        // Android 16 / API 36: Play rejects any AAB targeting 35 or lower since
        // the 2026-08-31 deadline ("Target SDK of artifact is too low"), which
        // broke the Internal Testing upload on `main`. RN 0.81's own template
        // already defaults to 36.
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Internal tooling (native-dev): inert unless OCTOPUS_ANDROID_DEV_REPO is set.
// Resolves com.octopuscommunity only from that repository during a native
// dev-source window. Declared once, idempotently: two exclusive declarations
// for the same group make it unresolvable.
def octopusNativeDevRepo = System.getenv("OCTOPUS_ANDROID_DEV_REPO")
if (octopusNativeDevRepo) {
    allprojects {
        repositories {
            if (findByName("octopusNativeDev") == null) {
                exclusiveContent {
                    forRepository {
                        maven {
                            name = "octopusNativeDev"
                            url = uri(octopusNativeDevRepo)
                        }
                    }
                    filter { includeGroup("com.octopuscommunity") }
                }
            }
        }
    }
}
